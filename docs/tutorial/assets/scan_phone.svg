  <text x="160" y="320" font-family="Arial" font-size="20" fill="#305460">Strain: C57BL/6J</text>
  <text x="160" y="352" font-family="Arial" font-size="20" fill="#305460">M/F: 2 / 3</text>
  <rect x="160" y="390" width="190" height="190" fill="#fff" stroke="#1d3c47" stroke-width="3"/>
  <rect x="170" y="400" width="170" height="170" fill="#1d3c47" opacity="0.08"/>
