  <rect x="390" y="438" width="190" height="78" fill="#fff" stroke="#1d3c47" stroke-width="2"/>
  <line x1="402" y1="452" x2="568" y2="452" stroke="#1d3c47" stroke-width="3"/>
  <line x1="402" y1="468" x2="568" y2="468" stroke="#1d3c47" stroke-width="2"/>
  <line x1="402" y1="484" x2="568" y2="484" stroke="#1d3c47" stroke-width="4"/>
  <line x1="402" y1="500" x2="568" y2="500" stroke="#1d3c47" stroke-width="2"/>
  <text x="390" y="550" font-family="Arial" font-size="17" fill="#305460">Barcode (optional)</text>

  <rect x="760" y="150" width="300" height="560" rx="34" fill="url(#phone)"/>
  <rect x="778" y="194" width="264" height="452" rx="20" fill="#f4faf7"/>
  <rect x="804" y="236" width="212" height="64" rx="12" fill="#e1f0ea"/>
  <text x="820" y="275" font-family="Arial" font-size="24" font-weight="700" fill="#14553f">Open Link</text>
  <rect x="804" y="320" width="212" height="292" rx="12" fill="#fff" stroke="#d0e2db"/>
  <text x="822" y="364" font-family="Arial" font-size="19" fill="#285160">Cage C-A1-0243</text>
  <text x="822" y="398" font-family="Arial" font-size="16" fill="#4c6671">Status: Holding</text>
  <text x="822" y="430" font-family="Arial" font-size="16" fill="#4c6671">M/F: 2 / 3</text>
  <rect x="822" y="470" width="178" height="52" rx="10" fill="#0f7a58"/>
  <text x="842" y="503" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Open Murisphere</text>

  <path d="M670 430 C730 430, 735 430, 750 430" stroke="#115f45" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#115f45"/>
