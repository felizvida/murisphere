  </defs>

  <text x="1090" y="320" font-family="Arial" font-size="26" font-weight="700" fill="#114734">Key Action</text>
  <text x="1090" y="356" font-family="Arial" font-size="20" fill="#234a58">1. Camera detects QR</text>
  <text x="1090" y="388" font-family="Arial" font-size="20" fill="#234a58">2. Tap link banner</text>
  <text x="1090" y="420" font-family="Arial" font-size="20" fill="#234a58">3. Verify cage ID</text>
  <text x="1090" y="452" font-family="Arial" font-size="20" fill="#234a58">4. Open for edits</text>
