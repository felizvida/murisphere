<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6f2"/>
      <stop offset="1" stop-color="#d8e9e2"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="1" stop-color="#273640"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="800" fill="url(#bg)"/>
  <text x="90" y="90" font-family="Arial" font-size="48" font-weight="700" fill="#12262f">Phone Scan Workflow</text>
  <rect x="90" y="130" width="560" height="560" rx="22" fill="#fff" stroke="#c8ddd4" stroke-width="3"/>
  <text x="120" y="190" font-family="Arial" font-size="28" font-weight="700" fill="#0f4e3a">Printed Cage Card</text>
  <rect x="130" y="220" width="480" height="420" rx="14" fill="#f8fcfa" stroke="#cdded8" stroke-width="2"/>
