<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <rect width="1400" height="840" fill="#f0f6f4"/>
  <text x="80" y="90" font-family="Arial" font-size="48" font-weight="700" fill="#152b34">Scan Troubleshooting</text>
  <rect x="80" y="130" width="1240" height="640" rx="18" fill="#ffffff" stroke="#cadfd7" stroke-width="3"/>

  <rect x="120" y="180" width="360" height="520" rx="14" fill="#fff7f5" stroke="#e8c2b8"/>
  <text x="145" y="230" font-family="Arial" font-size="30" font-weight="700" fill="#a13b2f">Problem</text>
  <text x="145" y="280" font-family="Arial" font-size="22" fill="#5b6770">Blank / broken QR</text>
  <text x="145" y="318" font-family="Arial" font-size="22" fill="#5b6770">No scan prompt</text>
  <text x="145" y="356" font-family="Arial" font-size="22" fill="#5b6770">Wrong URL opens</text>
  <text x="145" y="394" font-family="Arial" font-size="22" fill="#5b6770">Link opens slowly</text>

  <rect x="520" y="180" width="360" height="520" rx="14" fill="#f5fbf8" stroke="#c5e2d3"/>
  <text x="545" y="230" font-family="Arial" font-size="30" font-weight="700" fill="#195b43">Cause</text>
  <text x="545" y="280" font-family="Arial" font-size="22" fill="#43606c">Cached JS / blocked CDN</text>
  <text x="545" y="318" font-family="Arial" font-size="22" fill="#43606c">Low contrast / glare</text>
  <text x="545" y="356" font-family="Arial" font-size="22" fill="#43606c">Scan Base URL mis-set</text>
  <text x="545" y="394" font-family="Arial" font-size="22" fill="#43606c">Weak room Wi-Fi/LAN</text>

  <rect x="920" y="180" width="360" height="520" rx="14" fill="#f4f7ff" stroke="#bec9eb"/>
  <text x="945" y="230" font-family="Arial" font-size="30" font-weight="700" fill="#2b4f8d">Action</text>
  <text x="945" y="280" font-family="Arial" font-size="22" fill="#3f5768">Hard refresh + regenerate cards</text>
  <text x="945" y="318" font-family="Arial" font-size="22" fill="#3f5768">Improve lighting and distance</text>
  <text x="945" y="356" font-family="Arial" font-size="22" fill="#3f5768">Set phone-reachable base URL</text>
  <text x="945" y="394" font-family="Arial" font-size="22" fill="#3f5768">Retest on same network</text>

  <text x="120" y="742" font-family="Arial" font-size="24" fill="#305060">If unresolved, capture browser console errors and include the cage card ID and timestamp.</text>
</svg>
