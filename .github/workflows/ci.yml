name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc librsvg2-bin texlive-xetex
          if ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get install -y chromium || sudo apt-get install -y chromium-browser || true
          fi

      - name: Python syntax check
        run: |
          python -m py_compile app.py storage.py generate_postgres_schema.py seed_large_demo.py alert_coverage_verifier.py cage_card_layout_audit.py docs/tutorial/build_tutorial_pdf.py postgres_export_bundle.py postgres_readiness_audit.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Cage card layout audit
        run: |
          CHROME_BIN=$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium binary not found on runner; skipping render audit."
            exit 0
          fi
          MURISPHERE_AUDIT_ALLOW_RENDER_SKIP=1 python cage_card_layout_audit.py --chrome-bin "$CHROME_BIN"

      - name: Build tutorial PDF (LaTeX)
        run: |
          python docs/tutorial/build_tutorial_pdf.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend syntax check
        run: |
          node --check static/app.js

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: murisphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d murisphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MURISPHERE_DB_DIALECT: postgres
      MURISPHERE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murisphere_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg

          dsn = os.environ["MURISPHERE_DATABASE_URL"]
          deadline = time.time() + 30
          while True:
              try:
                  with psycopg.connect(dsn):
                      print("PostgreSQL ready")
                      raise SystemExit(0)
              except psycopg.OperationalError:
                  if time.time() >= deadline:
                      raise
                  time.sleep(1)
          PY

      - name: Run PostgreSQL integration tests
        run: |
          python -m unittest tests.test_postgres_integration -v

  desktop-check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: desktop
        run: |
          npm install

      - name: Sync desktop version
        working-directory: desktop
        run: |
          npm run sync-version

      - name: Desktop scaffold tests
        run: |
          python3 -m unittest tests.test_desktop_scaffold -v

      - name: Cargo format check
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all --check

      - name: Cargo check
        run: |
          cargo check --manifest-path desktop/src-tauri/Cargo.toml
